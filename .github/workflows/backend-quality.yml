name: Backend Quality

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-quality.yml"
  push:
    branches:
      - master
    paths:
      - "backend/**"
      - ".github/workflows/backend-quality.yml"

concurrency:
  group: backend-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg18-trixie
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stock_app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d stock_app_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stock_app_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: backend-quality-test-secret
      MASTER_ENCRYPTION_KEY: backend-quality-test-encryption-key
      WHATSAPP_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.5
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Run backend integration suites
        shell: bash
        run: |
          set +e
          failed=0
          test_files=(
            src/tests/api-contract.test.js
            src/tests/pdf.service.test.js
            src/tests/delivery-memo-domain.test.js
            src/tests/phase1-security.test.js
            src/tests/phase2-core.test.js
            src/tests/stock-count.test.js
            src/tests/sale-amendments.test.js
            src/tests/realtime.test.js
            src/tests/frontend-events.test.js
            src/tests/harden-mobile.test.js
            src/tests/harden-server-cache.test.js
          )

          shopt -s nullglob
          whatsapp_tests=(src/tests/whatsapp.*.test.js)
          test_files+=("${whatsapp_tests[@]}")

          for test_file in "${test_files[@]}"; do
            echo "::group::${test_file}"
            timeout 120s node run-tests.js "${test_file}"
            status=$?
            echo "::endgroup::"
            if [ "${status}" -ne 0 ]; then
              if [ "${status}" -eq 124 ]; then
                echo "::error file=backend/${test_file},title=Backend integration suite timed out::${test_file} did not terminate within 120 seconds"
              else
                echo "::error file=backend/${test_file},title=Backend integration suite failed::${test_file} failed with exit code ${status}"
              fi
              failed=1
            fi
          done

          exit "${failed}"
