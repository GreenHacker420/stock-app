name: Mobile PR Typecheck

'on':
  pull_request:
    branches:
      - master
    paths:
      - stock/**
      - .github/workflows/pr-mobile-typecheck.yml

concurrency:
  group: mobile-pr-typecheck-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stock

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: stock/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck Expo client
        run: npm run typecheck
