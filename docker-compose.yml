services:
  shop-backend:
    image: ${IMAGE_NAME}:${IMAGE_TAG:-latest}
    container_name: shop-backend
    restart: always
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    shm_size: 128m
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '1.0'
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=6600
    networks:
      - backend_app

networks:
  backend_app:
    external: true
